<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Sistema de Cadastro</title>
</head>

<body class="bg-gray-100">

  <div id="header"></div>

  <div class="container mx-auto p-8">
    <div class="flex flex-col items-center gap-6 max-w-md mx-auto">

      <a href="cadastro.html"
        class="w-full text-center p-6 bg-white shadow rounded-xl hover:bg-blue-50 transition text-xl font-semibold">
        Cadastro
      </a>

      <a href="relatorios.html"
        class="w-full text-center p-6 bg-white shadow rounded-xl hover:bg-green-50 transition text-xl font-semibold">
        Relatórios
      </a>

      <a id="btnLista" href="lista.html"
        class="hidden w-full text-center p-6 bg-white shadow rounded-xl hover:bg-purple-50 transition text-xl font-semibold">
        Lista (Admin)
      </a>

      <a id="btnUsers" href="users.html"
        class="hidden w-full text-center p-6 bg-white shadow rounded-xl hover:bg-yellow-50 transition text-xl font-semibold">
        Usuários (Admin)
      </a>

    </div>
  </div>

  <script src="../js/header.js"></script>

  <script>
    renderHeader(); 

    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));
    if (usuario?.nivel === "admin") {
      document.getElementById("btnLista").classList.remove("hidden");
      document.getElementById("btnUsers").classList.remove("hidden");
    }
  </script>

</body>
</html>
