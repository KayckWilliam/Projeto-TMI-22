<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Lista de Responsáveis</title>
</head>

<body class="bg-gray-100">

  <div id="header"></div>

  <div class="container mx-auto p-8">

    <h1 class="text-3xl font-bold mb-8 text-center">Lista de Responsáveis</h1>

    <div class="flex gap-4 mb-6">
      <a href="index.html"
        class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
        Voltar
      </a>
      
      <div class="flex-1 flex gap-2">
        <input id="pesquisa" type="text" placeholder="Pesquisar por nome do responsável, criança ou CPF..." 
          class="flex-1 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="btnPesquisar" 
          class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-semibold">
          Pesquisar
        </button>
        <button id="btnLimpar" 
          class="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">
          Limpar
        </button>
      </div>
    </div>

    <div id="listaResponsaveis" class="space-y-6"></div>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-6">
    <div class="bg-white p-6 rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
      <h2 class="text-2xl font-bold mb-4">Detalhes do Responsável</h2>

      <div id="modalContent" class="space-y-3 text-gray-700"></div>

      <button onclick="fecharModal()" 
        class="mt-4 w-full py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
        Fechar
      </button>
    </div>
  </div>

  <div id="modalEditar" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-6">
    <div class="bg-white p-6 rounded-xl shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <h2 class="text-2xl font-bold mb-4">Editar Responsável</h2>

      <form id="formEditar" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Nome:</label>
          <input type="text" id="editNome" class="w-full px-3 py-2 border rounded" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">CPF:</label>
          <input type="text" id="editCpf" class="w-full px-3 py-2 border rounded" maxlength="14" placeholder="XXX.XXX.XXX-XX" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">RG:</label>
          <input type="text" id="editRg" class="w-full px-3 py-2 border rounded" maxlength="12" placeholder="XX.XXX.XXX-X" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Telefone:</label>
          <input type="text" id="editTelefone" class="w-full px-3 py-2 border rounded" maxlength="15" placeholder="(XX) XXXXX-XXXX" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Filiação:</label>
          <select id="editFiliacao" class="w-full px-3 py-2 border rounded" required>
            <option value="">Selecione...</option>
            <option value="Mãe">Mãe</option>
            <option value="Pai">Pai</option>
            <option value="Avó">Avó</option>
            <option value="Avô">Avô</option>
            <option value="Tia">Tia</option>
            <option value="Tio">Tio</option>
            <option value="Irmã">Irmã</option>
            <option value="Irmão">Irmão</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <h3 class="text-lg font-semibold border-b pb-2 mt-6">Endereço</h3>

        <div>
          <label class="block text-sm font-medium mb-1">CEP:</label>
          <input type="text" id="editCep" class="w-full px-3 py-2 border rounded" maxlength="9" placeholder="XXXXX-XXX" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Rua:</label>
          <input type="text" id="editRua" class="w-full px-3 py-2 border rounded" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Número:</label>
          <input type="text" id="editNumero" class="w-full px-3 py-2 border rounded" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Bairro:</label>
          <input type="text" id="editBairro" class="w-full px-3 py-2 border rounded" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Cidade:</label>
          <input type="text" id="editCidade" class="w-full px-3 py-2 border rounded" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Estado:</label>
          <select id="editEstado" class="w-full px-3 py-2 border rounded" required>
            <option value="">Selecione...</option>
            <option value="AC">AC</option>
            <option value="AL">AL</option>
            <option value="AP">AP</option>
            <option value="AM">AM</option>
            <option value="BA">BA</option>
            <option value="CE">CE</option>
            <option value="DF">DF</option>
            <option value="ES">ES</option>
            <option value="GO">GO</option>
            <option value="MA">MA</option>
            <option value="MT">MT</option>
            <option value="MS">MS</option>
            <option value="MG">MG</option>
            <option value="PA">PA</option>
            <option value="PB">PB</option>
            <option value="PR">PR</option>
            <option value="PE">PE</option>
            <option value="PI">PI</option>
            <option value="RJ">RJ</option>
            <option value="RN">RN</option>
            <option value="RS">RS</option>
            <option value="RO">RO</option>
            <option value="RR">RR</option>
            <option value="SC">SC</option>
            <option value="SP">SP</option>
            <option value="SE">SE</option>
            <option value="TO">TO</option>
          </select>
        </div>

        <div class="flex gap-2 mt-6">
          <button type="submit" class="flex-1 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
            Salvar
          </button>
          <button type="button" onclick="fecharModalEditar()" class="flex-1 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/header.js"></script>
  <script type="module" src="../js/lista.js"></script>

</body>
</html>
