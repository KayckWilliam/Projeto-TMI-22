<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Cadastro</title>
</head>

<body class="bg-gray-100">

  <div class="container mx-auto p-8 max-w-xl">

    <!-- Título -->
    <h1 class="text-3xl font-bold mb-10 text-center">Escolher Tipo de Cadastro</h1>

    <!-- Barra de Pesquisa -->
    <div class="mb-6">
      <input 
        id="campoPesquisa"
        type="text"
        placeholder="Pesquisar por nome, sobrenome ou endereço..."
        class="w-full p-3 border rounded-lg shadow-sm focus:outline-none focus:ring focus:ring-blue-300"
      >
      <button 
        onclick="pesquisar()"
        class="mt-3 w-full p-3 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition"
      >
        Pesquisar
      </button>
    </div>

    <!-- Exibição dos resultados da pesquisa -->
    <div id="resultadosPesquisa" class="mt-4"></div>

    <!-- Bloco de botões -->
    <div class="flex flex-col gap-6 mt-10">

      <!-- Botão cadastrar → vai para enderecos.html -->
      <a href="enderecos.html"
         class="w-full text-center p-6 bg-green-500 text-white shadow rounded-xl 
                hover:bg-green-600 transition text-xl font-semibold">
        Cadastrar
      </a>


      <!-- Voltar ao início -->
      <a href="index.html"
         class="w-full text-center p-4 bg-gray-200 shadow rounded-xl 
                hover:bg-gray-300 transition text-lg font-medium">
        Voltar
      </a>

    </div>

  </div>

  <!-- Script da pesquisa -->
  <script>
    function pesquisar() {
      const termo = document.getElementById("campoPesquisa").value.toLowerCase();
      const resultadosDiv = document.getElementById("resultadosPesquisa");

      if (!termo.trim()) {
        resultadosDiv.innerHTML = "<p class='text-red-600 font-semibold'>Digite algo para pesquisar.</p>";
        return;
      }

      // Obtém TODOS os bancos
      const criancas = JSON.parse(localStorage.getItem("criancas") || "[]");
      const responsaveis = JSON.parse(localStorage.getItem("responsaveis") || "[]");
      const denunciantes = JSON.parse(localStorage.getItem("denunciantes") || "[]");

      // Unifica em um array só
      const banco = [
        ...criancas.map(c => ({ tipo: "Criança", ...c })),
        ...responsaveis.map(r => ({ tipo: "Responsável", ...r })),
        ...denunciantes.map(d => ({ tipo: "Denunciante", ...d })),
      ];

      // Filtra
      const resultados = banco.filter(item =>
        (item.nome && item.nome.toLowerCase().includes(termo)) ||
        (item.sobrenome && item.sobrenome.toLowerCase().includes(termo)) ||
        (item.endereco && item.endereco.toLowerCase().includes(termo))
      );

      // Mostra na tela
      if (resultados.length === 0) {
        resultadosDiv.innerHTML = "<p class='text-gray-600'>Nenhum resultado encontrado.</p>";
        return;
      }

      resultadosDiv.innerHTML = resultados.map(r => `
        <div class="p-3 bg-white shadow rounded-lg border mb-2">
          <p><strong>Tipo:</strong> ${r.tipo}</p>
          <p><strong>Nome:</strong> ${r.nome || "–"}</p>
          <p><strong>Sobrenome:</strong> ${r.sobrenome || "–"}</p>
          <p><strong>Endereço:</strong> ${r.endereco || "–"}</p>
        </div>
      `).join("");
    }
  </script>

</body>
</html>
