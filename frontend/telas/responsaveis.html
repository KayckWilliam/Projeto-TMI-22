<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Cadastro de Responsáveis</title>
</head>

<body class="bg-gray-100">

  <div id="header"></div>

  <div class="container mx-auto p-8 max-w-3xl">

    <h1 class="text-3xl font-bold mb-8 text-center">Cadastro de Responsáveis</h1>

    <form id="formResp" class="bg-white shadow p-8 rounded-xl space-y-8">

      <div>
        <h2 class="text-2xl font-semibold mb-4 border-b pb-2">1. Identificação</h2>

        <label class="block mt-4">Nome</label>
        <input name="nome" class="w-full p-2 border rounded" required>

        <label class="block mt-2">Data de Nascimento</label>
        <input type="date" name="data_nascimento" class="w-full p-2 border rounded" required>

        <label class="block mt-2">CPF</label>
        <input name="cpf" class="w-full p-2 border rounded" required>

        <label class="block mt-2">RG</label>
        <input name="rg" class="w-full p-2 border rounded" required>

        <label class="block mt-4">Filiação</label>
        <select name="filiacao" class="w-full p-2 border rounded" required>
          <option value="">Selecione...</option>
          <option value="mãe">Mãe</option>
          <option value="pai">Pai</option>
          <option value="tio">Tio</option>
          <option value="tia">Tia</option>
          <option value="avô">Avô</option>
          <option value="avó">Avó</option>
          <option value="outro">Outro</option>
          <option value="denunciante">Denunciante</option>
        </select>

        <label class="block mt-4">Telefone</label>
        <input name="telefone" class="w-full p-2 border rounded" required>

        <label class="block mt-2">Email</label>
        <input type="email" name="email" class="w-full p-2 border rounded" required>
      </div>

      <div>
        <h2 class="text-xl font-semibold mb-2">Vínculos</h2>
        <p id="vinculosBox" class="p-3 bg-blue-100 border rounded text-blue-700 font-bold"></p>
      </div>

      <button class="w-full bg-blue-600 text-white px-6 py-3 rounded-lg text-lg font-semibold hover:bg-blue-700">
        Salvar
      </button>

    </form>

  </div>

  <script src="../js/header.js"></script>
  <script src="../js/responsaveis.js"></script>

</body>
</html>
