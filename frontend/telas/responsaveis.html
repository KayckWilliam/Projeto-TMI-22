<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Cadastro de Responsáveis</title>
</head>

<body class="bg-gray-100">

<div class="container mx-auto p-8 max-w-3xl">

  <h1 class="text-3xl font-bold mb-8 text-center">Cadastro de Responsáveis</h1>

  <form id="formResponsavel" class="bg-white shadow p-8 rounded-xl space-y-8">

    <!-- ========================== -->
    <!-- SEÇÃO 1 — Identificação -->
    <!-- ========================== -->
    <div>
      <h2 class="text-2xl font-semibold mb-4 border-b pb-2">1. Identificação</h2>

      <!-- ID Automático -->
      <div class="mb-4">
        <label class="block mb-2 text-gray-700 font-semibold">ID Gerado</label>
        <div id="idGerado" class="p-2 bg-gray-100 border rounded text-gray-700 font-bold">
          <!-- preenchido via JS -->
        </div>
      </div>

      <!-- Nome -->
      <label class="block mb-2 font-medium">Nome</label>
      <input type="text" name="nome"
             class="w-full p-2 border rounded mb-4"
             required>

      <!-- Data de nascimento -->
      <label class="block mb-2 font-medium">Data de Nascimento</label>
      <input type="date" name="data_nascimento"
             class="w-full p-2 border rounded mb-4"
             required>

      <!-- CPF -->
      <label class="block mb-2 font-medium">CPF</label>
      <input type="text" name="cpf"
             class="w-full p-2 border rounded mb-4"
             placeholder="000.000.000-00"
             required>

      <!-- RG -->
      <label class="block mb-2 font-medium">RG</label>
      <input type="text" name="rg"
             class="w-full p-2 border rounded"
             placeholder="000000000"
             required>
    </div>

    <!-- ========================== -->
    <!-- SEÇÃO 2 — Endereço -->
    <!-- ========================== -->
    <div>
      <h2 class="text-2xl font-semibold mb-4 border-b pb-2">2. Endereço</h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block mb-1 font-medium">CEP</label>
          <input type="text" name="cep" class="w-full p-2 border rounded" required>
        </div>

        <div class="md:col-span-2">
          <label class="block mb-1 font-medium">Rua</label>
          <input type="text" name="rua" class="w-full p-2 border rounded" required>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <div>
          <label class="block mb-1 font-medium">Número</label>
          <input type="text" name="numero" class="w-full p-2 border rounded" required>
        </div>

        <div>
          <label class="block mb-1 font-medium">Bairro</label>
          <input type="text" name="bairro" class="w-full p-2 border rounded" required>
        </div>

        <div>
          <label class="block mb-1 font-medium">Cidade</label>
          <input type="text" name="cidade" class="w-full p-2 border rounded" required>
        </div>
      </div>

      <div class="mt-4">
        <label class="block mb-1 font-medium">Estado</label>
        <input type="text" name="estado" class="w-full p-2 border rounded" required>
      </div>
    </div>

    <!-- ========================== -->
    <!-- SEÇÃO 3 — Contato -->
    <!-- ========================== -->
    <div>
      <h2 class="text-2xl font-semibold mb-4 border-b pb-2">3. Contato</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block mb-1 font-medium">Telefone</label>
          <input type="tel" name="telefone"
                 class="w-full p-2 border rounded"
                 placeholder="(DDD) 00000-0000" required>
        </div>

        <div>
          <label class="block mb-1 font-medium">E-mail</label>
          <input type="email" name="email"
                 class="w-full p-2 border rounded"
                 placeholder="exemplo@email.com" required>
        </div>
      </div>
    </div>

    <!-- ========================== -->
    <!-- SEÇÃO 4 — Dependência -->
    <!-- ========================== -->
    <div>
      <h2 class="text-2xl font-semibold mb-4 border-b pb-2">4. Criança Dependente</h2>

      <label class="block mb-2 font-medium">ID da Criança</label>
      <input type="number" name="crianca_id"
             class="w-full p-2 border rounded"
             placeholder="Informe o ID da criança cadastrada"
             required>
    </div>

    <!-- ========================== -->
    <!-- Botão -->
    <!-- ========================== -->
    <div class="text-center pt-4">
      <button type="submit"
        class="bg-blue-600 text-white px-6 py-3 rounded-lg text-lg hover:bg-blue-700 transition">
        Salvar Responsável
      </button>
    </div>

  </form>

</div>

<!-- ============================= -->
<!-- JS — ID SEQUENCIAL -->
<!-- ============================= -->
<script>
  function gerarIdSequencial() {
    // Busca lista salva
    let lista = JSON.parse(localStorage.getItem("responsaveis") || "[]");

    // ID = quantidade de itens + 1
    return lista.length + 1;
  }

  // Insere no HTML
  document.getElementById("idGerado").innerText = gerarIdSequencial();
</script>

<script src="/js/responsaveis.js"></script>

</body>
</html>
