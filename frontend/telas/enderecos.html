<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Cadastrar Endereço</title>
</head>

<body class="bg-gray-100">

<div class="container mx-auto p-8 max-w-2xl">

  <h1 class="text-3xl font-bold mb-8 text-center">Cadastrar Endereço</h1>

  <!-- FORMULÁRIO -->
  <form id="formEndereco" class="bg-white shadow p-6 rounded-xl space-y-4">

    <div>
      <label class="font-medium">CEP:</label>
      <input type="text" id="cep" class="w-full p-2 border rounded">
    </div>

    <div>
      <label class="font-medium">Rua:</label>
      <input type="text" id="rua" class="w-full p-2 border rounded">
    </div>

    <div>
      <label class="font-medium">Número:</label>
      <input type="text" id="numero" class="w-full p-2 border rounded">
    </div>

    <div>
      <label class="font-medium">Bairro:</label>
      <input type="text" id="bairro" class="w-full p-2 border rounded">
    </div>

    <div>
      <label class="font-medium">Cidade:</label>
      <input type="text" id="cidade" class="w-full p-2 border rounded">
    </div>

    <div>
      <label class="font-medium">Estado:</label>
      <input type="text" id="estado" class="w-full p-2 border rounded">
    </div>

    <!-- BOTÕES -->
    <div class="flex gap-4 pt-4">

      <!-- BOTÃO SALVAR (salva + avança) -->
      <button type="submit"
        class="w-full py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition">
        Salvar Endereço
      </button>

      <!-- BOTÃO IR DIRETO PARA CRIANÇAS (NÃO SALVA) -->
      <button type="button" id="btnIrCriancas"
        class="w-full py-3 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700 transition">
        Ir para Crianças
      </button>

    </div>

  </form>

  <!-- BOTÃO VOLTAR -->
  <div class="text-center mt-8">
    <a href="index.html"
       class="px-6 py-3 bg-gray-300 rounded-lg hover:bg-gray-400 transition text-lg font-medium">
      Voltar
    </a>
  </div>

</div>

<script src="/js/api.js"></script>

<script>
// ENVIO NORMAL DO FORMULÁRIO
document.getElementById("formEndereco").addEventListener("submit", async (e) => {
  e.preventDefault();

  const endereco = {
    cep: document.getElementById("cep").value,
    rua: document.getElementById("rua").value,
    numero: document.getElementById("numero").value,
    bairro: document.getElementById("bairro").value,
    cidade: document.getElementById("cidade").value,
    estado: document.getElementById("estado").value,
  };

  // Envia sem validar
  fetch(API.enderecos, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(endereco)
  });

  // Redireciona
  window.location.href = "criancas.html";
});

// IR DIRETO PARA A PÁGINA CRIANÇAS (NÃO SALVA)
document.getElementById("btnIrCriancas").addEventListener("click", () => {
  window.location.href = "criancas.html";
});
</script>

</body>
</html>
