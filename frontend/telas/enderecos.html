<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Cadastrar Endereço</title>
</head>

<body class="bg-gray-100">

  <div id="header"></div>

  <div class="container mx-auto p-8 max-w-2xl">

    <h1 class="text-3xl font-bold mb-8 text-center">Cadastrar Endereço</h1>

    <form id="formEndereco" class="bg-white shadow p-6 rounded-xl space-y-4">

      <div>
        <label class="font-medium">CEP:</label>
        <input type="text" id="cep" placeholder="12345-678" maxlength="9" class="w-full p-2 border rounded">
        <span id="cepError" class="text-red-500 text-sm hidden">CEP inválido. Use o formato: 12345-678</span>
      </div>

      <div>
        <label class="font-medium">Rua:</label>
        <input type="text" id="rua" class="w-full p-2 border rounded">
      </div>

      <div>
        <label class="font-medium">Número:</label>
        <input type="text" id="numero" class="w-full p-2 border rounded">
      </div>

      <div>
        <label class="font-medium">Bairro:</label>
        <input type="text" id="bairro" class="w-full p-2 border rounded">
      </div>

      <div>
        <label class="font-medium">Cidade:</label>
        <input type="text" id="cidade" class="w-full p-2 border rounded">
      </div>

      <div>
        <label class="font-medium">Estado:</label>
        <select id="estado" class="w-full p-2 border rounded">
          <option value="">Selecione um estado</option>
          <option value="AC">Acre</option>
          <option value="AL">Alagoas</option>
          <option value="AP">Amapá</option>
          <option value="AM">Amazonas</option>
          <option value="BA">Bahia</option>
          <option value="CE">Ceará</option>
          <option value="DF">Distrito Federal</option>
          <option value="ES">Espírito Santo</option>
          <option value="GO">Goiás</option>
          <option value="MA">Maranhão</option>
          <option value="MT">Mato Grosso</option>
          <option value="MS">Mato Grosso do Sul</option>
          <option value="MG">Minas Gerais</option>
          <option value="PA">Pará</option>
          <option value="PB">Paraíba</option>
          <option value="PR">Paraná</option>
          <option value="PE">Pernambuco</option>
          <option value="PI">Piauí</option>
          <option value="RJ">Rio de Janeiro</option>
          <option value="RN">Rio Grande do Norte</option>
          <option value="RS">Rio Grande do Sul</option>
          <option value="RO">Rondônia</option>
          <option value="RR">Roraima</option>
          <option value="SC">Santa Catarina</option>
          <option value="SP">São Paulo</option>
          <option value="SE">Sergipe</option>
          <option value="TO">Tocantins</option>
        </select>
      </div>

      <button type="submit"
        class="w-full py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition">
        Salvar Endereço
      </button>

    </form>

    <div class="text-center mt-8">
      <a href="index.html"
         class="px-6 py-3 bg-gray-300 rounded-lg hover:bg-gray-400 transition text-lg font-medium">
        Voltar
      </a>
    </div>

  </div>

  <script src="../js/header.js"></script>
  <script type="module" src="../js/enderecos.js"></script>

</body>
</html>
