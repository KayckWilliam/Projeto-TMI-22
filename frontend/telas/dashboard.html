<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Dashboard - Estatísticas</title>
</head>

<body class="bg-gray-100">

  <div id="header"></div>

  <div class="container mx-auto p-8">
    
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">Dashboard - Estatísticas</h1>
      <a href="index.html" class="bg-gray-500 text-white px-6 py-2 rounded hover:bg-gray-600">
        Voltar
      </a>
    </div>

    <!-- Cards de Estatísticas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      
      <div class="bg-white shadow rounded-xl p-6">
        <h3 class="text-gray-500 text-sm font-semibold mb-2">Total de Crianças</h3>
        <p id="totalCriancas" class="text-4xl font-bold text-blue-600">-</p>
      </div>

      <div class="bg-white shadow rounded-xl p-6">
        <h3 class="text-gray-500 text-sm font-semibold mb-2">Total de Responsáveis</h3>
        <p id="totalResponsaveis" class="text-4xl font-bold text-green-600">-</p>
      </div>

      <div class="bg-white shadow rounded-xl p-6">
        <h3 class="text-gray-500 text-sm font-semibold mb-2">Total de Relatórios</h3>
        <p id="totalRelatorios" class="text-4xl font-bold text-purple-600">-</p>
      </div>

    </div>

    <!-- Gráficos -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- Gráfico de Denúncias -->
      <div class="bg-white shadow rounded-xl p-6">
        <h3 class="text-lg font-semibold mb-4">Distribuição por Tipo de Denúncia</h3>
        <canvas id="graficoDenuncias"></canvas>
      </div>

      <!-- Gráfico por Bairro -->
      <div class="bg-white shadow rounded-xl p-6">
        <h3 class="text-lg font-semibold mb-4">Estatísticas por Bairro</h3>
        <canvas id="graficoBairros"></canvas>
      </div>

      <!-- Gráfico de Faixa Etária -->
      <div class="bg-white shadow rounded-xl p-6">
        <h3 class="text-lg font-semibold mb-4">Distribuição por Faixa Etária</h3>
        <canvas id="graficoIdades"></canvas>
      </div>

    </div>

    <!-- Tabela de Relatórios Pendentes -->
    <div class="bg-white shadow rounded-xl p-6 mt-6">
      <h3 class="text-lg font-semibold mb-4">Últimos Relatórios Cadastrados</h3>
      <div id="listaRelatorios" class="space-y-3">
        <p class="text-gray-500">Carregando...</p>
      </div>
    </div>

  </div>

  <script src="../js/header.js"></script>
  <script type="module" src="../js/dashboard.js"></script>

</body>
</html>
