<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Cadastro de Crianças</title>
</head>

<body class="bg-gray-100">

  <div id="header"></div>

  <div class="container mx-auto p-8 max-w-2xl">

    <h1 class="text-2xl font-bold mb-6">Cadastro de Crianças</h1>

    <form id="formCrianca" class="bg-white shadow p-6 rounded">

      

      <label class="block mb-2">Nome</label>
      <input id="nome" required class="w-full p-2 border rounded mb-4" />
      <span id="nomeError" class="text-red-500 text-sm hidden">Nome não pode conter números</span>

      <label class="block mb-2">Data de Nascimento</label>
      <input id="data_nascimento" type="text" required placeholder="DD/MM/AAAA" maxlength="10" class="w-full p-2 border rounded mb-4" />
      <span id="dataError" class="text-red-500 text-sm hidden">Data inválida. Use DD/MM/AAAA (entre 1900 e hoje).</span>

      <div class="flex justify-between mt-6">
        <button id="btnAdicionar" type="button"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Adicionar
        </button>

        <button id="btnSalvarContinuar" type="button"
          class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
          Salvar e continuar
        </button>
      </div>

    </form>

    <div class="bg-white shadow p-6 rounded mt-6">
      <h2 class="text-xl font-semibold mb-4">Crianças adicionadas</h2>
      <ul id="listaTemp" class="space-y-2"></ul>
    </div>

  </div>

  <script src="../js/header.js"></script>
  <script type="module" src="../js/criancas.js"></script>

</body>
</html>
