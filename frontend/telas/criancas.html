<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Crianças</title>
</head>

<body class="bg-gray-100">

<div class="container mx-auto p-8">

  <h1 class="text-2xl font-bold mb-6">Cadastro de Crianças</h1>

  <!-- Formulário -->
  <form id="formCrianca" class="bg-white shadow p-6 rounded">

    <!-- ID Gerado Automaticamente -->
    <div class="mb-4">
      <label class="block mb-2 text-gray-700 font-semibold">ID Gerado</label>
      <div id="idGerado" class="p-2 bg-gray-100 border rounded text-gray-700 font-bold">
        <!-- Será preenchido via JS -->
      </div>
    </div>

    <!-- Nome -->
    <label class="block mb-2">Nome</label>
    <input name="nome" required class="w-full p-2 border rounded mb-4" />

    <!-- Data de Nascimento -->
    <label class="block mb-2">Data de nascimento</label>
    <input type="date" name="data_nascimento" required class="w-full p-2 border rounded mb-4" />

    <!-- Botões -->
    <div class="flex gap-4 mt-4">
      <button type="submit"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Salvar
      </button>

      <button id="btnSalvarContinuar" type="button"
        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
        Salvar e continuar
      </button>
    </div>

  </form>

  <!-- Lista -->
  <h2 class="text-xl font-semibold mt-8 mb-2">Lista de Crianças</h2>
  <table class="w-full bg-white shadow rounded">
    <thead>
      <tr class="bg-gray-200">
        <th class="p-2">ID</th>
        <th class="p-2">Nome</th>
        <th class="p-2">Ações</th>
      </tr>
    </thead>
    <tbody id="listaCriancas"></tbody>
  </table>

</div>

<!-- SCRIPT PRINCIPAL -->
<script>
  // --- GERAÇÃO DE ID AUTOMÁTICO ---
  function gerarIdSequencial() {
    let lista = JSON.parse(localStorage.getItem("criancas") || "[]");
    return lista.length + 1;
  }

  document.getElementById("idGerado").innerText = gerarIdSequencial();

  // --- SALVAR CRIANÇA NO LOCALSTORAGE ---
  function salvarCriancaLocal() {
    const nome = document.querySelector("input[name='nome']").value;
    const data = document.querySelector("input[name='data_nascimento']").value;

    let lista = JSON.parse(localStorage.getItem("criancas") || "[]");

    const novaCrianca = {
      id: lista.length + 1,
      nome: nome,
      data_nascimento: data
    };

    lista.push(novaCrianca);
    localStorage.setItem("criancas", JSON.stringify(lista));
  }

  // --- BOTÃO SALVAR NORMAL ---
  document.getElementById("formCrianca").addEventListener("submit", (e) => {
    e.preventDefault();
    salvarCriancaLocal();
    location.reload(); // Atualiza a tela
  });

  // --- BOTÃO SALVAR E CONTINUAR ---
  document.getElementById("btnSalvarContinuar").addEventListener("click", () => {
    salvarCriancaLocal();
    window.location.href = "responsaveis.html";
  });

  // --- CARREGAR LISTA DE CRIANÇAS ---
  function carregarLista() {
    const lista = JSON.parse(localStorage.getItem("criancas") || "[]");
    const tbody = document.getElementById("listaCriancas");

    tbody.innerHTML = "";

    lista.forEach(c => {
      tbody.innerHTML += `
        <tr class="border-b">
          <td class="p-2 text-center">${c.id}</td>
          <td class="p-2 text-center">${c.nome}</td>
          <td class="p-2 text-center">
            <button class="text-red-600 hover:underline" onclick="removerCrianca(${c.id})">
              Remover
            </button>
          </td>
        </tr>
      `;
    });
  }

  // --- REMOVER CRIANÇA ---
  function removerCrianca(id) {
    let lista = JSON.parse(localStorage.getItem("criancas") || "[]");
    lista = lista.filter(c => c.id !== id);

    localStorage.setItem("criancas", JSON.stringify(lista));
    location.reload();
  }

  carregarLista();
</script>

</body>
</html>
